[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "rangeslib"
version = "0.1.0"
description = "Composable Python ranges and range adaptors"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.12"

[tool.setuptools.packages.find]
where = ["src"]
