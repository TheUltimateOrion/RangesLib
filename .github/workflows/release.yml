name: Release

on:
  push:
    branches:
      - main
    paths:
      - pyproject.toml

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      actions: write
      contents: write
    outputs:
      release: ${{ steps.version.outputs.release }}
      version: ${{ steps.version.outputs.version }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install development dependencies
        run: python -m pip install --editable ".[dev]"

      - name: Run complete quality gate
        run: ./scripts/check_all.sh

      - name: Build and smoke-test distributions
        run: ./scripts/check_package.sh

      - name: Detect a version change
        id: version
        env:
          PREVIOUS_SHA: ${{ github.event.before }}
        run: |
          current_version="$(python -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')"
          previous_version=""

          if git cat-file -e "${PREVIOUS_SHA}:pyproject.toml" 2>/dev/null; then
            previous_version="$(git show "${PREVIOUS_SHA}:pyproject.toml" | python -c 'import sys, tomllib; print(tomllib.load(sys.stdin.buffer)["project"]["version"])')"
          fi

          echo "version=${current_version}" >> "$GITHUB_OUTPUT"
          if [[ "$current_version" == "$previous_version" ]]; then
            echo "release=false" >> "$GITHUB_OUTPUT"
          else
            echo "release=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Create GitHub release
        if: steps.version.outputs.release == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="v${{ steps.version.outputs.version }}"
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "Release $tag already exists."
          else
            gh release create "$tag" \
              --target "$GITHUB_SHA" \
              --title "rangeslib $tag" \
              --generate-notes
          fi

      - name: Start PyPI publishing workflow
        if: steps.version.outputs.release == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh workflow run publish.yml \
            --ref "$GITHUB_REF_NAME" \
            --field tag_name="v${{ steps.version.outputs.version }}"
